<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMO 1-kun film</title>
<style>
/* 1920×1080 film. Brand: #FF0158, #002E60, white; Inter. The 9:16 footage sits in panels. */
:root { --navy:#002E60; --deep:#001a3a; --red:#FF0158; --font:"AIFU Sans","Helvetica Neue",Helvetica,Arial,sans-serif; }
@font-face { font-family:"AIFU Sans"; font-weight:400; font-display:block; src:url(assets/fonts/inter-latin-400-normal.woff2) format("woff2"); unicode-range:U+0000-00FF,U+02BB-02BC,U+2000-206F,U+2212; }
@font-face { font-family:"AIFU Sans"; font-weight:400; font-display:block; src:url(assets/fonts/inter-latin-ext-400-normal.woff2) format("woff2"); unicode-range:U+0100-02BA,U+02BD-02FF; }
@font-face { font-family:"AIFU Sans"; font-weight:500; font-display:block; src:url(assets/fonts/inter-latin-500-normal.woff2) format("woff2"); unicode-range:U+0000-00FF,U+02BB-02BC,U+2000-206F,U+2212; }
@font-face { font-family:"AIFU Sans"; font-weight:500; font-display:block; src:url(assets/fonts/inter-latin-ext-500-normal.woff2) format("woff2"); unicode-range:U+0100-02BA,U+02BD-02FF; }
@font-face { font-family:"AIFU Sans"; font-weight:700; font-display:block; src:url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); unicode-range:U+0000-00FF,U+02BB-02BC,U+2000-206F,U+2212; }
@font-face { font-family:"AIFU Sans"; font-weight:700; font-display:block; src:url(assets/fonts/inter-latin-ext-700-normal.woff2) format("woff2"); unicode-range:U+0100-02BA,U+02BD-02FF; }

html,body { margin:0; height:100%; background:#000; overflow:hidden; }
#stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; overflow:hidden; background:var(--deep);
  transform-origin:50% 50%; font-family:var(--font); color:#fff; -webkit-font-smoothing:antialiased; }
#stage * { box-sizing:border-box; }
.abs { position:absolute; }

/* background */
#bg { position:absolute; inset:0; background:radial-gradient(ellipse 70% 90% at 70% 40%, #0a3f7a 0%, var(--navy) 45%, var(--deep) 100%); }
#grid { position:absolute; inset:-80px; background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 80px); }
.glyph { position:absolute; font-weight:700; color:rgba(255,255,255,.06); white-space:nowrap; }

/* three panels */
#tri { position:absolute; inset:0; display:none; background:var(--deep); }
.pan { position:absolute; top:0; width:636px; height:1080px; overflow:hidden; }
.pan img { position:absolute; left:0; top:-25px; width:636px; height:1131px; transform-origin:50% 50%; }
#p0 { left:0; } #p1 { left:642px; } #p2 { left:1284px; }
#triDark { position:absolute; inset:0; background:#00142e; opacity:0; }
#triGrad { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 60%, rgba(0,10,30,.65) 100%); }

/* talking head */
#th { position:absolute; inset:0; display:none; }
#thAcc { position:absolute; left:142px; top:46px; width:120px; height:260px; background:var(--red); }
#thp { position:absolute; left:170px; top:70px; width:528px; height:940px; overflow:hidden; border-radius:22px; background:#000; box-shadow:0 30px 80px rgba(0,0,0,.5); }
#thp img { position:absolute; left:0; top:0; width:528px; height:940px; transform-origin:50% 50%; }
#chap { position:absolute; left:790px; top:96px; display:flex; align-items:center; gap:20px; font-size:30px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.85); }
#chap b { display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; background:var(--red); color:#fff; letter-spacing:0; font-size:32px; }
#who { position:absolute; left:790px; top:200px; width:1020px; }
#whoName { font-size:52px; font-weight:700; letter-spacing:-.02em; line-height:1.12; }
#whoRole { margin-top:12px; font-size:32px; font-weight:500; color:rgba(255,255,255,.72); }
#whoBar { width:120px; height:8px; background:var(--red); margin-top:26px; transform-origin:0 50%; }
#statsW { position:absolute; left:790px; top:196px; display:flex; gap:26px; }
.statW { display:flex; align-items:baseline; gap:16px; height:150px; padding:0 34px; font-weight:700; white-space:nowrap; }
.statW .n { font-size:118px; letter-spacing:-.05em; line-height:1; } .statW .u { font-size:44px; text-transform:uppercase; }
#sw1 { background:var(--red); } #sw2 { background:#fff; color:var(--navy); }
#trWin { position:absolute; left:790px; top:370px; width:1040px; height:640px; overflow:hidden; }
#tr { position:absolute; left:0; right:0; bottom:0; }
.ln { font-size:62px; font-weight:700; line-height:1.24; letter-spacing:-.02em; padding:4px 0; }
.ln.old { opacity:.26; }
.ln .w.todo { opacity:.32; }
.ln .w.hi { color:#FF3D7F; }

/* overlays */
#hook { position:absolute; left:0; right:0; top:330px; text-align:center; font-size:104px; font-weight:700; line-height:1.04; letter-spacing:-.035em; text-transform:uppercase; text-shadow:0 6px 34px rgba(0,0,0,.6); }
#hook .hw { display:inline-block; margin:0 16px; transform-origin:50% 80%; }
#hook .hw.hi { color:var(--red); }
#title { position:absolute; inset:0; display:none; }
#simo { position:absolute; left:0; right:0; top:250px; text-align:center; font-size:300px; font-weight:700; letter-spacing:-.04em; line-height:1; }
#simo span { display:inline-block; }
#tbar { position:absolute; left:50%; top:575px; height:14px; width:560px; margin-left:-280px; background:var(--red); transform-origin:0 50%; }
#tsub { position:absolute; left:0; right:0; top:620px; text-align:center; font-size:52px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
#tchip { position:absolute; left:50%; top:720px; }
.chip { display:inline-flex; align-items:center; gap:16px; height:86px; padding:0 32px; background:var(--red); font-size:48px; font-weight:700; letter-spacing:.02em; white-space:nowrap; text-transform:uppercase; }
#chapBig { position:absolute; left:0; right:0; top:380px; text-align:center; display:none; }
#chapBig .num { display:inline-flex; align-items:center; justify-content:center; width:150px; height:150px; background:var(--red); font-size:84px; font-weight:700; }
#chapBig .txt { margin-top:30px; font-size:110px; font-weight:700; letter-spacing:-.02em; text-transform:uppercase; text-shadow:0 6px 30px rgba(0,0,0,.55); }
#counter { position:absolute; left:0; right:0; top:200px; text-align:center; display:none; }
#cNum { font-size:300px; font-weight:700; letter-spacing:-.05em; line-height:1; text-shadow:0 8px 50px rgba(0,0,0,.5); }
#cNum b { color:var(--red); }
#cL1 { font-size:72px; font-weight:700; letter-spacing:-.02em; margin-top:4px; text-shadow:0 4px 24px rgba(0,0,0,.6); }
#cL2 { display:inline-block; margin-top:20px; }
#tsubs { position:absolute; left:120px; right:120px; top:860px; height:150px; display:flex; align-items:center; justify-content:center; text-align:center; }
#tsubsIn { font-size:60px; font-weight:700; line-height:1.15; letter-spacing:-.015em; text-shadow:0 4px 22px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.5); }
.w { display:inline-block; border-radius:12px; padding:0 8px; margin:0 -4px; }
#tsubs .w.todo { opacity:.42; }
#tsubs .w.now { background:var(--red); text-shadow:none; }
#tsubs .w.hi:not(.now) { color:#FF3D7F; }

#tab { position:absolute; right:64px; top:0; width:100px; height:116px; background:#fff; z-index:40; }
#tab img { position:absolute; left:14px; top:22px; width:72px; }

#end { position:absolute; inset:0; display:none; overflow:hidden; background:var(--navy); }
#endLogo { position:absolute; left:50%; top:150px; width:280px; height:280px; margin-left:-140px; border-radius:50%; background:#fff; box-shadow:0 20px 70px rgba(0,0,0,.35); }
#endLogo img { position:absolute; left:50%; top:50%; width:196px; transform:translate(-50%,-50%); }
#endT1 { position:absolute; left:0; right:0; top:480px; text-align:center; font-size:96px; font-weight:700; letter-spacing:-.03em; }
#endT2 { position:absolute; left:0; right:0; top:600px; text-align:center; font-size:42px; font-weight:500; color:rgba(255,255,255,.8); }
#endChip { position:absolute; left:50%; top:690px; }
#endPh { position:absolute; left:0; right:0; top:830px; text-align:center; font-size:60px; font-weight:700; letter-spacing:.02em; }
#endUni { position:absolute; left:0; right:0; top:915px; text-align:center; font-size:32px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.7); }

#wipe { position:absolute; top:0; left:0; width:1920px; height:1080px; display:none; z-index:45; }
#wipe div { position:absolute; top:0; height:1080px; }
#flash { position:absolute; inset:0; background:#fff; opacity:0; z-index:50; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="grid"></div><div id="glyphs"></div>

  <div id="tri">
    <div class="pan" id="p0"><img alt=""></div><div class="pan" id="p1"><img alt=""></div><div class="pan" id="p2"><img alt=""></div>
    <div id="triDark"></div><div id="triGrad"></div>
  </div>

  <div id="th">
    <div id="thAcc"></div>
    <div id="thp"><img id="thImg" alt=""></div>
    <div id="chap"><b id="chapN"></b><span id="chapT"></span></div>
    <div id="who"><div id="whoName"></div><div id="whoRole"></div><div id="whoBar"></div></div>
    <div id="statsW"><div class="statW" id="sw1"><span class="n">4,5</span><span class="u">soat</span></div><div class="statW" id="sw2"><span class="n">5</span><span class="u">ta masala</span></div></div>
    <div id="trWin"><div id="tr"></div></div>
  </div>

  <div id="hook"></div>
  <div id="title">
    <div id="simo"><span>S</span><span>I</span><span>M</span><span>O</span></div>
    <div id="tbar"></div>
    <div id="tsub">Xalqaro matematika olimpiadasi</div>
    <div id="tchip"><div class="chip">1-kun</div></div>
  </div>
  <div id="chapBig"><div class="num" id="cbN"></div><div class="txt" id="cbT"></div></div>
  <div id="counter"><div id="cNum"><b>0</b></div><div id="cL1">nafar talaba</div><div id="cL2" class="chip">roʻyxatdan oʻtdi</div></div>
  <div id="tsubs"><div id="tsubsIn"></div></div>

  <div id="end">
    <div class="abs" style="inset:-80px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 80px);"></div>
    <div id="endGlyphs"></div>
    <div id="endLogo"><img src="assets/logo.png" alt=""></div>
    <div id="endT1">SIMO · 1-kun</div>
    <div id="endT2">Xalqaro matematika olimpiadasi</div>
    <div id="endChip"><div class="chip">Davomi bor</div></div>
    <div id="endPh">78 555 21 21</div>
    <div id="endUni">Aniq va ijtimoiy fanlar universiteti</div>
  </div>

  <div id="tab"><img src="assets/logo.png" alt=""></div>
  <div id="wipe"><div id="wA" style="width:1920px;background:var(--red)"></div><div id="wB" style="width:1920px;background:var(--navy)"></div></div>
  <div id="flash"></div>
</div>
<script src="edit.js"></script>
<script src="common.js"></script>
<script>
(() => {
'use strict';
const { $, prog, easeOut, easeIn, easeInOut, back, lerp, set, env } = H;
const W = 1920, Hh = 1080, FPS = H.FPS;
const E = window.EDIT, F = E.wide, DUR = F.DUR, DROP = F.DROP, CH = E.CHUNKS;
const SC = F.scenes, END = SC.find(s => s.kind === 'end').t0;
const sceneAt = t => { let k = 0; SC.forEach((s, i) => { if (t >= s.t0) k = i; }); return SC[k]; };
const speechIn = (t, t0, t1) => { let it = null; for (const s of F.speech) if (s.video !== false && s.t <= t && s.t >= t0 - .01 && s.t < t1) it = s; return it; };
const syncSrc = it => t => Math.min(it.a + (t - it.t), it.b);

/* background glyphs */
const GL = ['∑', 'π', '∫ f(x) dx', '√2', '∞', 'Δ', 'x² + y²', 'n!', 'θ', 'eⁱᵖ', '≠', 'lim', 'a·b', '∂'];
const glyphHTML = GL.map((g, i) => `<div class="glyph" id="%${i}" style="left:${(i * 271) % 1800 + 20}px;top:${(i * 197) % 960 + 20}px;font-size:${70 + (i * 41) % 110}px">${g}</div>`).join('');
$('#glyphs').innerHTML = glyphHTML.replace(/%/g, 'g'); $('#endGlyphs').innerHTML = glyphHTML.replace(/%/g, 'e');
function glyphs(t) { GL.forEach((g, i) => { const y = (-(t * (6 + i * 1.7)) % 1200).toFixed(1); set($('#g' + i), 'transform', `translate3d(0,${y}px,0)`); set($('#e' + i), 'transform', `translate3d(0,${(-(t - END) * (10 + i * 2)).toFixed(1)}px,0)`); }); }

/* ───── three panels ───── */
const pimg = [0, 1, 2].map(i => $(`#p${i} img`));
function tri(t, S) {
  const on = S.kind === 'tri'; set($('#tri'), 'display', on ? 'block' : 'none'); if (!on) return;
  let j = 0; S.cuts.forEach((c, k) => { if (t >= c) j = k; });
  const c0 = S.cuts[j], c1 = j + 1 < S.cuts.length ? S.cuts[j + 1] : S.t1;
  ['L', 'C', 'R'].forEach((key, i) => {
    const v = S[key][j]; let src;
    if (v === 'sync') { const it = speechIn(t, S.t0, S.t1) || F.speech.find(s => s.t >= S.t0); src = syncSrc(it)(t); }
    else src = v + (t - c0);
    H.setSrc(pimg[i], H.frame(src));
    let z = lerp(1.0, 1.06, easeInOut(prog(t, c0, c1 - c0)));
    const st = c0 + i * .06; if (t - c0 < .25) z *= lerp(1.12, 1, easeOut(prog(t, st, .22)));
    set(pimg[i], 'transform', `scale(${z.toFixed(4)})`);
  });
  let dk = .2;
  if (t < DROP) dk = .4; else if (S.title) dk = .62;
  if (S.chapter) dk = Math.max(dk, .55 * env(t, S.t0, S.t0 + 1.5, .1, .35));
  dk = Math.max(dk, .5 * env(t, C540, 10.4, .3, .2));
  set($('#triDark'), 'opacity', dk.toFixed(3));
}

/* ───── talking head + transcript ───── */
const thImg = $('#thImg');
let feedKey = null;
function th(t, S) {
  const on = S.kind === 'th'; set($('#th'), 'display', on ? 'block' : 'none'); if (!on) return;
  const it = speechIn(t, S.t0, S.t1) || F.speech.find(s => s.t >= S.t0);
  const src = syncSrc(it)(t);
  H.setSrc(thImg, H.frame(src));
  let z = lerp(1.0, 1.04, easeInOut(prog(t, it.t, it.b - it.a)));
  if (t - it.t < .3 && t >= it.t) z *= lerp(1.1, 1, easeOut(prog(t, it.t, .3)));
  set(thImg, 'transform', `scale(${z.toFixed(4)})`);
  // panel entrance on scene start
  const kin = easeOut(prog(t, S.t0, .45));
  set($('#thp'), 'transform', `translate3d(${((1 - kin) * -140).toFixed(1)}px,0,0)`);
  set($('#thAcc'), 'transform', `translate3d(0,${((1 - kin) * -300).toFixed(1)}px,0)`);
  // chapter
  H.html($('#chapN'), String(S.chapter[0]).padStart(2, '0')); H.html($('#chapT'), S.chapter[1]);
  set($('#chap'), 'opacity', easeOut(prog(t, S.t0 + .1, .35)).toFixed(3));
  // who
  const who = S.who.find(w => t >= w[0] && t < w[1]);
  set($('#who'), 'display', who ? 'block' : 'none');
  if (who) {
    H.html($('#whoName'), who[2]); H.html($('#whoRole'), who[3]);
    const k1 = easeOut(prog(t, who[0] + .15, .4)), k2 = easeOut(prog(t, who[0] + .28, .4)), out = easeIn(prog(t, who[1] - .2, .2));
    set($('#whoName'), 'transform', `translate3d(${((1 - k1) * 80).toFixed(1)}px,0,0)`); set($('#whoName'), 'opacity', (Math.min(1, k1 * 1.5) * (1 - out)).toFixed(3));
    set($('#whoRole'), 'transform', `translate3d(${((1 - k2) * 80).toFixed(1)}px,0,0)`); set($('#whoRole'), 'opacity', (Math.min(1, k2 * 1.5) * (1 - out)).toFixed(3));
    set($('#whoBar'), 'transform', `scaleX(${(easeOut(prog(t, who[0] + .3, .4)) * (1 - out)).toFixed(3)})`);
  }
  // stats
  set($('#statsW'), 'display', S.stats ? 'flex' : 'none');
  if (S.stats) S.stats.forEach((s, i) => {
    const ts = it.t + (s[0] - it.a) - .05, k = prog(t, ts, .32), el = $('#sw' + (i + 1));
    set(el, 'opacity', t < ts ? '0' : '1'); set(el, 'transform', `translate3d(0,${((1 - back(k)) * 60).toFixed(1)}px,0) scale(${lerp(.7, 1, back(k)).toFixed(3)})`);
  });
  // transcript feed: lines of the current bite, newest at the bottom
  const sa = H.speechAt(F.speech, t, .8);
  const lines = sa && sa.it.t >= S.t0 - .01 ? H.lines(CH, sa.it, 30) : [];
  const vis = lines.filter(l => l.s <= sa.src + .05);
  const key = sa ? sa.it.id + ':' + vis.length : 'none';
  const shown = vis.slice(-6);
  H.html($('#tr'), shown.map((l, i) => `<div class="ln${i < shown.length - 1 ? ' old' : ''}">${i < shown.length - 1 ? l.txt : H.wordsHTML(l.words, sa.src, { pill: false })}</div>`).join(''));
  if (vis.length) {
    const ts = sa.it.t + (vis[vis.length - 1].s - sa.it.a) - .06, k = easeOut(prog(t, ts, .28));
    const last = $('#tr').lastElementChild, hgt = last ? last.offsetHeight : 80;
    set($('#tr'), 'transform', `translate3d(0,${((1 - k) * hgt).toFixed(1)}px,0)`);
    if (last) set(last, 'opacity', Math.min(1, k * 1.6).toFixed(3));
    const fade = sa.it.t + (sa.it.b - sa.it.a); set($('#tr'), 'opacity', (1 - easeIn(prog(t, fade + .45, .3))).toFixed(3));
  }
  feedKey = key;
}

/* ───── overlays on panels ───── */
const hookIt = F.speech.find(s => s.style === 'hook');
const hookWords = CH.filter(c => c.s >= hookIt.a && c.s <= hookIt.b).flatMap(c => c.words);
$('#hook').innerHTML = hookWords.map((w, i) => `<span class="hw${w.hi ? ' hi' : ''}" id="hw${i}">${w.w}</span>${i === 1 ? '<br>' : ' '}`).join('');
function hook(t) {
  const on = t < DROP + .05; set($('#hook'), 'display', on ? 'block' : 'none'); if (!on) return;
  hookWords.forEach((w, i) => {
    const el = $('#hw' + i), ts = hookIt.t + (w.s - hookIt.a) - .04, k = prog(t, ts, .22);
    set(el, 'opacity', t < ts ? '0' : Math.min(1, k * 2.5).toFixed(3));
    set(el, 'transform', `scale(${(t < ts ? .6 : lerp(.6, 1, back(k))).toFixed(4)})`);
  });
  const out = prog(t, DROP - .1, .14); set($('#hook'), 'transform', `scale(${lerp(1, 1.25, easeIn(out)).toFixed(3)})`); set($('#hook'), 'opacity', (1 - out).toFixed(3));
}
const TT1 = SC[1].t1;
function title(t) {
  const on = t >= DROP && t < TT1; set($('#title'), 'display', on ? 'block' : 'none'); if (!on) return;
  [...$('#simo').children].forEach((el, i) => {
    const ts = DROP + i * .06, k = prog(t, ts, .3), e = back(k);
    set(el, 'opacity', t < ts ? '0' : Math.min(1, k * 3).toFixed(3));
    set(el, 'transform', `translate3d(0,${((1 - e) * -140).toFixed(1)}px,0) scale(${lerp(1.4, 1, easeOut(k)).toFixed(3)})`);
  });
  set($('#tbar'), 'transform', `scaleX(${easeOut(prog(t, DROP + .25, .35)).toFixed(3)})`);
  { const k = prog(t, DROP + .4, .35); set($('#tsub'), 'opacity', k.toFixed(3)); set($('#tsub'), 'transform', `translate3d(0,${((1 - easeOut(k)) * 40).toFixed(1)}px,0)`); }
  { const k = prog(t, DROP + .7, .3); set($('#tchip'), 'opacity', (t < DROP + .7 ? 0 : 1).toString()); set($('#tchip'), 'transform', `translateX(-50%) scale(${(t < DROP + .7 ? .4 : lerp(.4, 1, back(k))).toFixed(3)})`); }
  const out = prog(t, TT1 - .2, .2); set($('#title'), 'opacity', (1 - out).toFixed(3));
}
function chapBig(t, S) {
  const on = S.kind === 'tri' && S.chapter && t < S.t0 + 1.55; set($('#chapBig'), 'display', on ? 'block' : 'none'); if (!on) return;
  H.html($('#cbN'), String(S.chapter[0]).padStart(2, '0')); H.html($('#cbT'), S.chapter[1]);
  const k = prog(t, S.t0 + .05, .3), out = easeIn(prog(t, S.t0 + 1.3, .25));
  set($('#cbN'), 'transform', `scale(${lerp(.3, 1, back(k)).toFixed(3)}) rotate(${((1 - easeOut(k)) * -90).toFixed(1)}deg)`);
  const k2 = easeOut(prog(t, S.t0 + .15, .35)); set($('#cbT'), 'transform', `translate3d(0,${((1 - k2) * 50).toFixed(1)}px,0)`); set($('#cbT'), 'opacity', k2.toFixed(3));
  set($('#chapBig'), 'opacity', (1 - out).toFixed(3));
}
const N540 = F.speech.find(s => s.id === 'n540'), C540 = N540.t + (21.28 - N540.a) - .08;
function counter(t) {
  const on = t >= C540 && t < 10.3; set($('#counter'), 'display', on ? 'block' : 'none'); if (!on) return;
  const k = easeOut(prog(t, C540, .55)); H.html($('#cNum'), `<b>${Math.round(540 * k)}</b>`);
  set($('#counter'), 'opacity', env(t, C540, 10.3, .12, .2).toFixed(3));
  set($('#cNum'), 'transform', `scale(${lerp(.7, 1, back(prog(t, C540, .4))).toFixed(3)})`);
  for (const [id, d] of [['#cL1', .45], ['#cL2', .8]]) { const kk = prog(t, C540 + d, .3); set($(id), 'opacity', Math.min(1, kk * 1.8).toFixed(3)); set($(id), 'transform', `translate3d(0,${((1 - easeOut(kk)) * 40).toFixed(1)}px,0)`); }
}
function triSubs(t, S) {
  const sa = S.kind === 'tri' ? H.speechAt(F.speech, t) : null;
  const res = sa && sa.it.style !== 'hook' ? H.chunkAt(CH, sa.it, sa.src) : null;
  set($('#tsubs'), 'display', res ? 'flex' : 'none'); if (!res) return;
  H.html($('#tsubsIn'), H.wordsHTML(res.words, sa.src));
  const ts = sa.it.t + (res.s0 - sa.it.a) - .08, k = prog(t, ts, .16);
  set($('#tsubsIn'), 'transform', `scale(${lerp(.86, 1, back(k)).toFixed(3)})`);
}

/* ───── transitions, end card ───── */
const WIPES = SC.slice(2).filter((s, i) => s.kind !== SC[i + 1].kind || s.kind === 'end').map(s => s.t0);
function wipe(t) {
  const w = WIPES.find(x => t >= x - .24 && t < x + .26);
  set($('#wipe'), 'display', w !== undefined ? 'block' : 'none'); if (w === undefined) return;
  const k = prog(t, w - .24, .5), xa = lerp(-1920, 1920, easeInOut(k)), xb = lerp(-1920, 1920, easeInOut(prog(t, w - .2, .5)));
  set($('#wA'), 'transform', `translate3d(${xa.toFixed(1)}px,0,0)`); set($('#wB'), 'transform', `translate3d(${xb.toFixed(1)}px,0,0)`);
}
function endCard(t) {
  const on = t >= END; set($('#end'), 'display', on ? 'block' : 'none'); set($('#tab'), 'display', on ? 'none' : 'block'); if (!on) return;
  { const kk = prog(t, END + .25, .45); set($('#endLogo'), 'opacity', (t < END + .25 ? 0 : 1).toString()); set($('#endLogo'), 'transform', `scale(${(t < END + .25 ? .3 : lerp(.3, 1, back(kk))).toFixed(3)}) rotate(${((1 - easeOut(kk)) * -40).toFixed(1)}deg)`); }
  for (const [id, d, dist] of [['#endT1', .5, 50], ['#endT2', .65, 40], ['#endPh', 1.25, 40], ['#endUni', 1.4, 30]]) { const kk = prog(t, END + d, .35); set($(id), 'opacity', (t < END + d ? 0 : Math.min(1, kk * 1.8)).toFixed(3)); set($(id), 'transform', `translate3d(0,${((1 - easeOut(kk)) * dist).toFixed(1)}px,0)`); }
  { const kk = prog(t, END + .95, .3); set($('#endChip'), 'opacity', (t < END + .95 ? 0 : 1).toString()); set($('#endChip'), 'transform', `translateX(-50%) scale(${(t < END + .95 ? .4 : lerp(.4, 1, back(kk))).toFixed(3)})`); }
  const fo = prog(t, DUR - .5, .5); set($('#end'), 'filter', fo > 0 ? `brightness(${(1 - fo).toFixed(3)})` : 'none');
}
function flash(t) {
  let f = 0; for (const [t0, a] of [[DROP, .9], [F.EG_BAND, .25]]) if (t >= t0 && t < t0 + .25) f = Math.max(f, a * (1 - easeOut(prog(t, t0, .25))));
  set($('#flash'), 'opacity', f.toFixed(3));
}

function render(t) { const S = sceneAt(t); glyphs(t); tri(t, S); th(t, S); hook(t); title(t); chapBig(t, S); counter(t); triSubs(t, S); wipe(t); endCard(t); flash(t); }
async function seek(t) { H.pending.length = 0; render(t); await Promise.all(H.pending.splice(0)); }
function fit() { const s = Math.min(innerWidth / W, innerHeight / Hh); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
let playing = false, t0 = 0, c0 = 0; const au = new Audio('../build/mix_wide.wav');
function loop() { if (playing) { const t = t0 + (performance.now() / 1000 - c0); if (t >= DUR) { playing = false; au.pause(); } render(Math.min(t, DUR)); } requestAnimationFrame(loop); }
addEventListener('keydown', e => { if (e.key === ' ') { playing = !playing; if (playing) { c0 = performance.now() / 1000; au.currentTime = t0; au.play().catch(() => {}); } else { t0 += performance.now() / 1000 - c0; au.pause(); } } });
window.R = { seek, DUR, FPS, W, H: Hh };
const params = new URLSearchParams(location.search);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (params.has('t')) { t0 = +params.get('t'); seek(t0); } else render(0); if (!params.has('render')) requestAnimationFrame(loop); });
})();
</script>
